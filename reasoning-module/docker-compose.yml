services:
  ollama:
    image: ollama/ollama:0.5.11
    container_name: reasoning-module
    restart: always
    ports:
      - '11434:11434'
    volumes:
      - reasoning-module-data:/root/.ollama
      - ./reasoning-module/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - reasoning-module-net
    # deploy:
    # resources:
    # reservations:
    # devices:
    # - driver: nvidia # Enable GPU acceleration
    #   count: all
    #   capabilities: [gpu]
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    tty: true

networks:
  reasoning-module-net:
    driver: bridge

volumes:
  reasoning-module-data:
    driver: local
